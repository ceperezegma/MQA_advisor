name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Report only real correctness bugs and regressions. No style, formatting,
            or speculative edge-case nitpicks (ruff and pre-commit cover style).
            No security review. Check the change against the originating issue and
            CONTEXT.md / docs/adr/ where relevant. Post inline comments for specific
            problems, but skip any problem you already commented on in an earlier
            review of this PR. Post one short summary comment with
            `gh pr comment --edit-last --create-if-none`, so repeat runs update the same
            comment instead of adding a new one. It ends with a verdict line:
            "Verdict: OK to merge" or "Verdict: Changes needed" (a recommendation only;
            do not submit a formal review). If there are no real issues, say so.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
