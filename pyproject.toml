[project]
name = "mqa-advisor"
version = "0.1.0"
description = "Recommends how to improve the metadata quality of a data.europa.eu catalogue"
readme = "README.md"
authors = [
    { name = "Carlos Perez", email = "perez.carloseduardo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqa_advisor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is owned by `ruff format`; it does not wrap long comments/strings
    "UP042",  # properties.Importance(str, Enum): StrEnum would change str()/format() behavior
]

[tool.pytest.ini_options]
markers = [
    "integration: opt-in, needs real PPE credentials and network access (excluded by default)",
]
addopts = "-m 'not integration'"
